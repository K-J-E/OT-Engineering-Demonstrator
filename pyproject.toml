[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-graduate-demonstrator"
version = "0.1.0"
description = "Local fictional OT engineering demonstrator"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.141.1",
  "networkx==3.6.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "app/backend"}

[tool.setuptools.packages.find]
where = ["app/backend"]

[tool.setuptools.package-data]
ot_demo = ["infrastructure/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["app/backend"]
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "i1: Implementation Increment I1 contracts and inputs",
  "i2: Implementation Increment I2 topology and outage core",
  "i3: Implementation Increment I3 scenario transactions",
  "i4: Implementation Increment I4 restoration assessment and execution",
  "i5: Implementation Increment I5 validation and immutable evidence",
]
